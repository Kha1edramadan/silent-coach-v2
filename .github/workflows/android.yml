name: Silent Coach Android Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.1"

      - name: Core self-test
        run: |
          rm -rf /tmp/coretest
          mkdir -p /tmp/coretest
          javac -d /tmp/coretest app/src/main/java/com/silentcoach/v2/core/*.java
          java -cp /tmp/coretest com.silentcoach.v2.core.CoreSelfTest

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.silentcoach.v2
            adb shell am start -n com.silentcoach.v2/.MainActivity
            sleep 10
            pid=$(adb shell pidof com.silentcoach.v2 2>/dev/null || true)
            echo "APP_PID=$pid"
            adb logcat -d -t 600 | tee /tmp/silent-coach-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\.silentcoach\.v2" /tmp/silent-coach-logcat.txt; then
              echo "Silent Coach crashed during startup."
              exit 1
            fi
            test -n "$pid"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silent-coach-v2-release
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
