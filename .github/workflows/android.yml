name: Silent Coach Android Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Core self-test
        run: |
          rm -rf /tmp/coretest
          mkdir -p /tmp/coretest
          javac -d /tmp/coretest app/src/main/java/com/silentcoach/v2/core/*.java
          java -cp /tmp/coretest com.silentcoach.v2.core.CoreSelfTest

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Launch APK on Android emulator
        timeout-minutes: 8
        run: |
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd -n silent-coach-test -k "system-images;android-35;google_apis;x86_64" --force
          nohup emulator -avd silent-coach-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am force-stop com.silentcoach.v2
          adb shell am start -n com.silentcoach.v2/.MainActivity
          sleep 8
          adb shell pidof com.silentcoach.v2
          adb logcat -d -t 250 | tee /tmp/silent-coach-logcat.txt
          if grep -E "FATAL EXCEPTION|Process: com\.silentcoach\.v2" /tmp/silent-coach-logcat.txt; then
            echo "Silent Coach crashed on startup."
            exit 1
          fi

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silent-coach-v2-release
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
