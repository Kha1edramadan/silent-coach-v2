name: Silent Coach UI Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct Silent Coach source
        shell: bash
        run: |
          set -euo pipefail
          test -s source/ci-part-1.b64
          test -s source/ci-part-2.b64
          test -s source/ci-part-3.b64
          cat source/ci-part-1.b64 source/ci-part-2.b64 source/ci-part-3.b64 > /tmp/silent-coach-ci.b64
          base64 --decode /tmp/silent-coach-ci.b64 > /tmp/silent-coach-ci.tar.gz
          rm -rf build-src
          mkdir -p build-src
          tar -xzf /tmp/silent-coach-ci.tar.gz -C build-src
          test -f build-src/settings.gradle.kts
          test -f build-src/app/src/main/res/font/cairo.ttf

      - name: Build installable debug APK
        working-directory: build-src
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache --console=plain :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s build-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-coach-ui-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
