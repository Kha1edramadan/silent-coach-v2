name: Silent Coach Android Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.1"

      - name: Core self-test
        run: |
          rm -rf /tmp/coretest
          mkdir -p /tmp/coretest
          javac -d /tmp/coretest app/src/main/java/com/silentcoach/v2/core/*.java
          java -cp /tmp/coretest com.silentcoach.v2.core.CoreSelfTest

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Create CI release signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/silent-coach-ci-release.jks"
          PASS="silent-coach-ci-only"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias silentcoach \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=Silent Coach CI, OU=Build, O=Silent Coach, L=Cairo, ST=Cairo, C=EG" \
            >/dev/null 2>&1
          echo "CI_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CI_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign release APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias silentcoach \
            --ks-pass "pass:$CI_KEYSTORE_PASS" \
            --key-pass "pass:$CI_KEYSTORE_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify release signatures and outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 26 app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload release build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-coach-v2-release
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.silentcoach.v2
            adb shell am start -W -n com.silentcoach.v2/.MainActivity | tee /tmp/start-result.txt
            sleep 8
            adb shell dumpsys activity activities | tee /tmp/activity-state.txt
            adb shell dumpsys activity exit-info com.silentcoach.v2 | tee /tmp/exit-info.txt
            adb logcat -d -b crash -t 250 | tee /tmp/silent-coach-crash.txt
            adb logcat -d -t 1200 | grep -E "com.silentcoach.v2|AndroidRuntime" | tee /tmp/silent-coach-logcat.txt || true
            grep -E "mResumedActivity.*com.silentcoach.v2|ResumedActivity.*com.silentcoach.v2" /tmp/activity-state.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.silentcoach\.v2" /tmp/silent-coach-crash.txt /tmp/silent-coach-logcat.txt

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-coach-v2-runtime-diagnostics
          path: |
            /tmp/start-result.txt
            /tmp/app-pid.txt
            /tmp/activity-state.txt
            /tmp/exit-info.txt
            /tmp/silent-coach-crash.txt
            /tmp/silent-coach-logcat.txt
